name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build WebAPK with PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwabin
          # Здесь можно настроить упаковку, но проще всего использовать готовый шаблон Capacitor/Cordova
          echo "Preparing app..."

      # Альтернативный простой сборщик на базе WebView
      - name: Create Android Project
        uses: obsessive-dev/capacitor-action@v1
        with:
          appId: 'com.alslap.app'
          appName: 'Alslap School Helper'
          webDir: '.'
